name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Scratch virtual disk integration tests
        shell: pwsh
        env:
          VHDXDOCK_RUN_DISK_TESTS: '1'
        run: cargo test --locked --test windows_disks --test windows_builder -- --ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-test-logs
          path: |
            target/debug/deps/logs/
            ${{ runner.temp }}/VhdxDockLogs/
          if-no-files-found: ignore
      - run: cargo build --locked --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item target/release/vhdxdock.exe package/VhdxDock.exe
          Copy-Item README.md,LICENSE package/
          New-Item -ItemType Directory -Path package/docs | Out-Null
          Copy-Item docs/screenshots package/docs/ -Recurse
          $hash = (Get-FileHash package/VhdxDock.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VhdxDock.exe" | Set-Content package/SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path package/* -DestinationPath VhdxDock-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VhdxDock-windows-x64
          path: VhdxDock-windows-x64.zip
